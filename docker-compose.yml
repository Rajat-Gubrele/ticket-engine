services:
  postgres:
    image: postgres:16-alpine
    container_name: ticket-engine-postgres
    environment:
      POSTGRES_DB: ticket_engine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticket_engine"]
      interval: 5s
      timeout: 5s
      retries: 5

  ticket-engine-redis:
    image: redis:7-alpine
    container_name: ticket-engine-redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
spring.application.name=TicketEngine

# 1. Connection coordinates (matches your docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/ticket_engine
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
# 2. Hibernate Schema Generation Strategy
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 3. Flyway Settings
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# 4. SQL Logging (Watch the queries Hibernate executes)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# 5. Redis Cache Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
